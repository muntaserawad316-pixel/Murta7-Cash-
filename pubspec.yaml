name: ewallet_app
description: "محفظة إلكترونية عربية RTL — تحويلات، فواتير، سحب، وتكامل مع شركات الاتصالات"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0                       # لطلبات الـ API
  uuid: ^4.4.0                       # لتوليد idempotency keys
  flutter_secure_storage: ^9.2.0     # لتخزين access_token بشكل آمن
  url_launcher: ^6.3.0                # لفتح روابط الإعلانات الخارجية

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # لو حبيت تضيف خط Cairo فعلياً بدل الاعتماد على الخط الافتراضي:
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
